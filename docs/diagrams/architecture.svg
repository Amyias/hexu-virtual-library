<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">和序图书馆 · 系统架构</title><desc id="desc">源码基线 2.3.0 / efe19c0 · 实线为主要数据流，虚线为可选服务或资源加载</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b69"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#203b3b}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#627674}.lane{font-size:20px;font-weight:700}.node{font-size:19px;font-weight:700}.body{font-size:16px;fill:#4c6664}.label{font-size:15px;fill:#526b69;paint-order:stroke;stroke:#f5f7f4;stroke-width:7px;stroke-linejoin:round}</style><rect width="1440" height="1040" fill="#f5f7f4"/>
<text x="40" y="58" class="title"><tspan x="40" dy="0">和序图书馆 · 系统架构</tspan></text>
<text x="40" y="94" class="sub"><tspan x="40" dy="0">源码基线 2.3.0 / efe19c0 · 实线为主要数据流，虚线为可选服务或资源加载</tspan></text>
<rect x="40" y="130" width="870" height="650" rx="20" fill="#e7eeea" stroke="#cddbd5"/>
<text x="64" y="167" class="lane"><tspan x="64" dy="0">01 / 浏览器：展示、匹配与交互</tspan></text>
<rect x="950" y="130" width="450" height="650" rx="20" fill="#e9edf4" stroke="#cddbd5"/>
<text x="974" y="167" class="lane"><tspan x="974" dy="0">02 / Python：可选识别与语义</tspan></text>
<rect x="40" y="815" width="1360" height="180" rx="20" fill="#f0ece2" stroke="#cddbd5"/>
<text x="64" y="852" class="lane"><tspan x="64" dy="0">03 / 资产与发行：构建期生成，运行期读取</tspan></text>
<rect x="65" y="200" width="255" height="100" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="83" y="231" class="node"><tspan x="83" dy="0">用户入口</tspan></text>
<text x="83" y="258" class="body"><tspan x="83" dy="0">麦克风 / 搜索框 / 按钮</tspan><tspan x="83" dy="25">指针拖动 / 键盘</tspan></text>
<rect x="350" y="200" width="255" height="100" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="368" y="231" class="node"><tspan x="368" dy="0">识别适配器</tspan></text>
<text x="368" y="258" class="body"><tspan x="368" dy="0">speech.js + server-asr.js</tspan><tspan x="368" dy="25">探测后选择 ASR 通道</tspan></text>
<rect x="635" y="200" width="250" height="100" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="653" y="231" class="node"><tspan x="653" dy="0">浏览器语音服务</tspan></text>
<text x="653" y="258" class="body"><tspan x="653" dy="0">Web Speech API</tspan><tspan x="653" dy="25">无后端时使用此通道</tspan></text>
<polyline points="320,250 350,250" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="605,250 635,250" fill="none" stroke="#526b69" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<polyline points="192,300 192,335 365,335 365,370" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="210" y="328" class="label"><tspan x="210" dy="0">文本 / 控件直达</tspan></text>
<rect x="65" y="370" width="255" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="83" y="401" class="node"><tspan x="83" dy="0">本地馆藏匹配</tspan></text>
<text x="83" y="428" class="body"><tspan x="83" dy="0">intent.js：精确 / 片段 / 近似</tspan><tspan x="83" dy="25">标题、别名、编号、位置码</tspan><tspan x="83" dy="25">输出实际馆藏对象</tspan></text>
<rect x="350" y="370" width="255" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="368" y="401" class="node"><tspan x="368" dy="0">应用调度与状态</tspan></text>
<text x="368" y="428" class="body"><tspan x="368" dy="0">app.js / processText</tspan><tspan x="368" dy="25">唤醒、多轮、取书、归还</tspan><tspan x="368" dy="25">统一控制 GSAP 动画</tspan></text>
<rect x="635" y="370" width="250" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="653" y="401" class="node"><tspan x="653" dy="0">实时 3D 渲染</tspan></text>
<text x="653" y="428" class="body"><tspan x="653" dy="0">Three.js / WebGL</tspan><tspan x="653" dy="25">环境、光球、相机</tspan><tspan x="653" dy="25">架上书实例化</tspan></text>
<polyline points="477,300 477,370" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="488" y="340" class="label"><tspan x="488" dy="0">转录文本</tspan></text>
<polyline points="350,423 320,423" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="328" y="410" class="label"><tspan x="328" dy="0">查询</tspan></text>
<polyline points="605,423 635,423" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="65" y="585" width="255" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="83" y="616" class="node"><tspan x="83" dy="0">馆藏数据</tspan></text>
<text x="83" y="643" class="body"><tspan x="83" dy="0">catalog.js：11,360 条记录</tspan><tspan x="83" dy="25">12 本具名演示书</tspan><tspan x="83" dy="25">bookId / 坐标 / chipPayload</tspan></text>
<rect x="350" y="585" width="255" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="368" y="616" class="node"><tspan x="368" dy="0">界面反馈</tspan></text>
<text x="368" y="643" class="body"><tspan x="368" dy="0">DOM / CSS3 / 气泡</tspan><tspan x="368" dy="25">麦克风状态与识别记录</tspan><tspan x="368" dy="25">可选 speechSynthesis 播报</tspan></text>
<rect x="635" y="585" width="250" height="120" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="653" y="616" class="node"><tspan x="653" dy="0">书籍与芯片阅读器</tspan></text>
<text x="653" y="643" class="body"><tspan x="653" dy="0">reader/book.js</tspan><tspan x="653" dy="25">FrontHinge 铰链翻页</tspan><tspan x="653" dy="25">Canvas 中文纹理 / 芯片特写</tspan></text>
<polyline points="192,585 192,490" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="205" y="545" class="label"><tspan x="205" dy="0">读取索引</tspan></text>
<polyline points="477,490 477,585" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<polyline points="760,490 760,585" fill="none" stroke="#526b69" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="975" y="200" width="400" height="100" rx="12" fill="#f8faff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="993" y="231" class="node"><tspan x="993" dy="0">HTTP 服务与模式探测</tspan></text>
<text x="993" y="258" class="body"><tspan x="993" dy="0">asr-server.py · 默认 127.0.0.1:8090</tspan><tspan x="993" dy="25">静态文件 / healthz / ready 接口</tspan></text>
<rect x="975" y="370" width="400" height="120" rx="12" fill="#f8faff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="993" y="401" class="node"><tspan x="993" dy="0">SenseVoice 本地识别</tspan></text>
<text x="993" y="428" class="body"><tspan x="993" dy="0">POST /asr：16 kHz 单声道 WAV</tspan><tspan x="993" dy="25">sherpa-onnx + ONNX + NumPy</tspan><tspan x="993" dy="25">串行解码锁；模型运行在后端主机</tspan></text>
<polyline points="605,270 620,270 620,316 930,316 930,423 975,423" fill="none" stroke="#526b69" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="650" y="333" class="label"><tspan x="650" dy="0">就绪时：音频 → 转录</tspan></text>
<rect x="975" y="585" width="400" height="120" rx="12" fill="#f8faff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="993" y="616" class="node"><tspan x="993" dy="0">可选大模型语义层</tspan></text>
<text x="993" y="643" class="body"><tspan x="993" dy="0">POST /understand → /chat/completions</tspan><tspan x="993" dy="25">规则未命中时请求；校验 bookId</tspan><tspan x="993" dy="25">设置 / 更新接口只允许回环访问</tspan></text>
<polyline points="580,490 580,520 930,520 930,637 975,637" fill="none" stroke="#526b69" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="650" y="538" class="label"><tspan x="650" dy="0">未命中时：文本 → 意图</tspan></text>
<text x="65" y="748" class="body"><tspan x="65" dy="0">浏览器不直接访问大模型密钥；静态模式由 tools/serve.mjs 提供文件。</tspan></text>
<rect x="65" y="875" width="405" height="88" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="83" y="906" class="node"><tspan x="83" dy="0">Blender + Python</tspan></text>
<text x="83" y="933" class="body"><tspan x="83" dy="0">环境 / 植物 / 书籍模板 → GLB</tspan></text>
<rect x="500" y="875" width="400" height="88" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="518" y="906" class="node"><tspan x="518" dy="0">本地资产与馆藏清单</tspan></text>
<text x="518" y="933" class="body"><tspan x="518" dy="0">GLB + 贴图 + vendor + 3 份目录副本</tspan></text>
<rect x="930" y="875" width="445" height="88" rx="12" fill="#fff" stroke="#b5cbc0" stroke-width="1.5"/>
<text x="948" y="906" class="node"><tspan x="948" dy="0">桌面打包与版本更新</tspan></text>
<text x="948" y="933" class="body"><tspan x="948" dy="0">PyInstaller / WebView2 / GitHub Releases</tspan></text>
